<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SHERY PIANO V3 ULTRA</title>
<style>
body{background:#000;color:white;text-align:center;font-family:Arial;margin:0;padding:10px}
h1{color:#00ffcc;font-size:30px;text-shadow:0 0 15px #00ffcc;margin:5px}
.box{background:#111;border:2px solid #00ffcc;padding:10px;border-radius:20px;max-width:420px;margin:auto}
#arena{position:relative;width:100%;height:500px;background:linear-gradient(#000,#1a0033);border:2px solid #00ffcc;border-radius:15px;overflow:hidden;display:flex}
.lane{flex:1;border-right:1px solid #333;position:relative}
.tile{position:absolute;left:3px;right:3px;height:80px;background:linear-gradient(#ffcc00,#ff6600);border-radius:10px;text-align:center;line-height:80px;font-size:26px;box-shadow:0 0 20px #ffcc00;color:black;font-weight:bold}
.btn{background:#ffcc00;border:none;padding:16px 30px;font-size:20px;border-radius:12px;font-weight:bold;color:black;margin:5px}
</style>
</head>
<body>
<h1>SHERY PIANO V3 🔥🎹</h1>
<p>ULTRA FAST + REAL PIANO</p>
<div class="box">
<p style="font-weight:bold">Score: <span id="score">0</span> | Combo: <span id="combo">0</span> 🔥 | Best: <span id="best">0</span></p>
<div id="arena"><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div></div>
<p id="msg" style="color:#ffcc00;font-weight:bold">TAP KARO - ULTRA START!</p>
<button class="btn" id="startBtn">▶️ START ULTRA!</button><br>
<button class="btn" onclick="location.reload()" style="display:none;background:#ff3333;color:white" id="restartBtn">DOBARA KHELO 🔥</button>
<p>Volume FULL! 🎧</p>
</div>
<script>
let lanes=document.querySelectorAll('.lane');
let score=0,combo=0,over=false,started=false,speed=9;
let best=localStorage.getItem('sheryPianoBest')||0; document.getElementById('best').innerText=best;
let audioCtx=null, noteIdx=0;
let notes=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25,587.33,659.25,783.99,880.00,1046.5];
// REAL PIANO - Karplus style + harmonics
function playPiano(freq){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    let t=audioCtx.currentTime;
    let master=audioCtx.createGain(); master.gain.value=0.6; master.connect(audioCtx.destination);
    // 5 harmonics - asli piano jaisa
    let harms=[[1,0.6,2.5],[2,0.35,1.8],[3,0.2,1.2],[4,0.12,0.7],[5,0.06,0.4]];
    harms.forEach(h=>{
      let o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=freq*h[0];
      g.gain.setValueAtTime(h[1],t);
      g.gain.exponentialRampToValueAtTime(0.001,t+h[2]);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+h[2]+0.1);
    });
    // Thump - piano ki hammer wali awaz
    let o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
    o2.type='triangle'; o2.frequency.value=freq*0.5;
    g2.gain.setValueAtTime(0.15,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    o2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t+0.1);
  }catch(e){}
}
function playMiss(){ try{ if(!audioCtx) return; let o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.value=100; g.gain.setValueAtTime(0.25,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);}catch(e){} }
function startGame(){ if(started) return; started=true; document.getElementById('startBtn').style.display='none'; document.getElementById('msg').innerText='ULTRA MODE ON! 🔥🔥'; try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} spawnTile(); setInterval(spawnTile,350); }
document.getElementById('startBtn').addEventListener('click',startGame);
document.body.addEventListener('click',()=>{ if(!started) startGame(); });
function spawnTile(){ if(over||!started) return; let li=Math.floor(Math.random()*4); let t=document.createElement('div'); t.className='tile'; t.innerText='🎹'; t.style.top='-90px'; lanes[li].appendChild(t); let y=-90; let last=performance.now(); function move(now){ if(over) return; let dt=(now-last)/16.6; last=now; y+=speed*(dt>0?dt:1); t.style.top=y+'px'; if(y>500){ t.remove(); gameOver(); return; } requestAnimationFrame(move); } requestAnimationFrame(move); function hit(e){ e.preventDefault(); e.stopPropagation(); if(over) return; t.remove(); over=true; setTimeout(()=>over=false,10); let f=notes[noteIdx%notes.length]; noteIdx++; playPiano(f); score+=10+combo; combo++; if(combo%10==0 && speed<15) speed+=0.8; document.getElementById('score').innerText=score; document.getElementById('combo').innerText=combo; if(combo>2) document.getElementById('msg').innerText='COMBO x'+combo+' 🔥🔥 ULTRA!'; } t.addEventListener('touchstart',hit,{passive:false}); t.addEventListener('click',hit); }
function gameOver(){ if(over) return; over=true; playMiss(); if(score>best){best=score; localStorage.setItem('sheryPianoBest',best); document.getElementById('best').innerText=best;} document.getElementById('msg').innerText='GAME OVER! Score: '+score; document.getElementById('restartBtn').style.display='inline-block'; }
</script>
</body>
  </html>
