<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHERY OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#00ff00;font-family:monospace;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
h1{font-size:50px;text-shadow:0 0 20px #00ff00}
#time{font-size:22px;margin:15px}
.box{border:3px solid #00ff00;border-radius:25px;padding:30px;width:90%;max-width:400px;box-shadow:0 0 30px #00ff00}
#s{font-size:70px;color:#fff}
button{width:100%;padding:35px;font-size:35px;font-weight:bold;background:#00ff00;border:none;border-radius:20px;margin-top:20px}
button:active{transform:scale(0.95);background:#fff}
#msg{margin-top:20px;font-size:18px}
</style>
</head><body>
<h1>😎 SHERY OS</h1>
<div id="time"></div>
<div class="box">
<h2>🎮 CLICK GAME</h2>
<div>Score: <span id="s">0</span></div>
<button onclick="c()">👊 CLICK ME!</button>
<p id="msg">> Ready Boss...</p>
</div>
<script>
let n=0;
function c(){n++;document.getElementById('s').innerHTML=n;document.getElementById('msg').innerHTML='> Wah Boss! '+n+' Click!'}
setInterval(()=>{document.getElementById('time').innerHTML=new Date().toLocaleString()},1000)
</script>
</body></html>
